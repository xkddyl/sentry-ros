schema_version: 4

# Canonical ROS graph. Relative names in package code must resolve to these
# absolute names regardless of whether a node is launched under /sentry.
commands:
  raw_chassis:
    topic: /cmd_vel
    type: geometry_msgs/msg/Twist
    owner: nav2_or_teleop_or_policy_mux
  teleop_chassis:
    topic: /cmd_vel_teleop
    type: geometry_msgs/msg/Twist
    owner: teleop_adapter
  nav2_chassis:
    topic: /sentry/cmd_vel_nav
    type: geometry_msgs/msg/Twist
    owner: nav2_controller
    note: Optional diagnostic/input topic; it must be arbitrated into /cmd_vel.
  e2e_chassis:
    topic: /sentry/e2e/cmd_vel_raw
    type: geometry_msgs/msg/Twist
    owner: end_to_end_inference
    note: Raw learned policy output; it must be arbitrated into /cmd_vel and may never bypass safety_supervisor.
  safe_chassis:
    topic: /sentry/cmd_vel_safe
    type: geometry_msgs/msg/Twist
    owner: safety_supervisor_only
  raw_chassis_control:
    topic: /sentry/chassis_control
    type: sentinel_interfaces/msg/ChassisControl
    owner: chassis_mode_manager_or_authorized_controller
    note: Raw mode/frame/SPIN/FOLLOW request. It never goes directly to hardware.
  safe_chassis_control:
    topic: /sentry/chassis_control_safe
    type: sentinel_interfaces/msg/ChassisControl
    owner: safety_supervisor_only
  estop:
    topic: /sentry/estop
    type: std_msgs/msg/Bool
    owner: mode_manager_or_authorized_operator
  system_mode:
    topic: /sentry/system_mode
    type: std_msgs/msg/UInt8
    owner: mode_manager

tactical:
  battle_state:
    topic: /sentry/battle_state
    type: sentinel_interfaces/msg/BattleState
    owner: battle_state_adapter
  observation:
    topic: /sentry/policy/observation
    type: sentinel_interfaces/msg/PolicyObservation
    owner: observation_node
  command:
    topic: /sentry/policy/command
    type: sentinel_interfaces/msg/TacticalCommand
    owner: policy_node
  target_request:
    topic: /sentry/target_request
    type: std_msgs/msg/Int8
    owner: tactical_executor
  weapons_free_request:
    topic: /sentry/weapons_free_request
    type: std_msgs/msg/Bool
    owner: tactical_executor
  target_safe:
    topic: /sentry/target_safe
    type: std_msgs/msg/Int8
    owner: safety_supervisor_only
    sentinel_value: -1
  weapons_free_safe:
    topic: /sentry/weapons_free_safe
    type: std_msgs/msg/Bool
    owner: safety_supervisor_only

learning:
  e2e_observation:
    topic: /sentry/e2e/observation
    type: sentinel_interfaces/msg/EndToEndObservation
    owner: perception_or_sim_adapter
    frame: base_link
    schema_version: 1
  e2e_command:
    topic: /sentry/e2e/cmd_vel_raw
    type: geometry_msgs/msg/Twist
    owner: end_to_end_inference

state:
  clock:
    topic: /clock
    type: rosgraph_msgs/msg/Clock
    simulation_only: true
  odometry:
    topic: /sentry/odom
    type: nav_msgs/msg/Odometry
    owner: selected_simulator_or_state_estimator
  lio_odometry:
    topic: /sentry/lio/odom
    type: nav_msgs/msg/Odometry
    owner: point_lio
  joint_states:
    topic: /joint_states
    type: sensor_msgs/msg/JointState
    owner: selected_simulator_or_robot_state_publisher
  lidar_points:
    topic: /sentry/lidar/points
    type: sensor_msgs/msg/PointCloud2
    frame: lidar_link
    required_fields: [x, y, z, intensity, time]
    point_time_unit: s
  imu:
    topic: /sentry/imu
    type: sensor_msgs/msg/Imu
    frame: imu_link
  scan:
    topic: /sentry/scan
    type: sensor_msgs/msg/LaserScan
    required: false
  hardware_state:
    topic: /sentry/hardware_state
    type: sentinel_interfaces/msg/HardwareState
    owner: selected_mock_or_hardware_bridge
  hardware_diagnostics:
    topic: /sentry/hardware_diagnostics
    type: sentinel_interfaces/msg/HardwareDiagnostics
    owner: hardware_bridge
    note: Transport/protocol counters only; it may not command actuators.
  system_status:
    topic: /sentry/system_status
    type: sentinel_interfaces/msg/SystemStatus
    owner: safety_supervisor

tf_ownership:
  clock: /clock
  map_to_odom: localization_or_relocalization
  odom_to_base_link_sim: Isaac_Sim_or_mock_hardware
  odom_to_base_link_real: state_estimator
  base_link_to_robot_links: robot_state_publisher
  global_topics: [/tf, /tf_static]

rules:
  - Only safety_supervisor publishes /sentry/cmd_vel_safe.
  - Only safety_supervisor publishes /sentry/chassis_control_safe.
  - End-to-end inference may publish /sentry/e2e/cmd_vel_raw but never /sentry/cmd_vel_safe.
  - hardware_bridge subscribes to safe control buses only.
  - MCP and diagnostics may not publish /sentry/cmd_vel_safe, /sentry/chassis_control_safe, motor currents, PWM, or CAN frames.
  - Exactly one backend may own simulated or real odometry in a running mode.
